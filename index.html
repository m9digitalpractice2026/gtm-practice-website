
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTM Practice Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f7fb;
      color: #222;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    input {
      display: block;
      width: 95%;
      padding: 12px;
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Welcome to My GTM Practice Website</h1>
    <p>Learn GA4, Google Tag Manager and Conversion Tracking.</p>
  </div>

  <div class="card">
    <h2>Button Click Test</h2>
    <p>Click this button to practise event tracking.</p>
    <button id="test-button">Click Me</button>
  </div>

  <div class="card">
    <h2>Contact Form Test</h2>
    <form id="contact-form">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <button type="submit">Submit Form</button>
    </form>
  </div>

</body>
</html>
